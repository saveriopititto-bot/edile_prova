<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
<title>Gestionale Edile Mobile</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<style>
body { margin:0; background:#f3f2f2; font-family:'Archivo', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
a { color:#ec3013; text-decoration: none; }
a:hover { color:#ae1800; }
.active-btn:active { background: rgba(32,30,29,0.1) !important; }
.active-btn-red:active { opacity: 0.8 !important; }
textarea:focus { outline: none; border-color: #ec3013 !important; }

/* In a real app we'd load this font: */
@import url('https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&display=swap');
</style>
</head>
<body>
<div id="app">
    <!-- Template will be injected here by vue -->
</div>

<script>
const { createApp, ref, computed } = Vue;

const app = createApp({
    setup() {
        const view = ref('oggi'); // 'oggi', 'cantieri', 'cantiere', 'sal1', 'sal2', 'sal3', 'salOk', 'squadra', 'costi'
        
        // State Data
        const salPct = ref(65);
        const fattura = ref(false);
        const nota = ref('');
        const foto = ref([
            { bg: '#d7d3d3', fg: '#605d5d', tag: 'SOGGIORNO', ora: '14:22' },
            { bg: '#bab6b6', fg: '#2d2b2b', tag: 'CUCINA', ora: '14:25' }
        ]);
        
        const sel = ref({
            nome: 'Villa Rossi',
            cliente: 'Mario Rossi',
            indirizzo: 'Via Roma 12, Milano',
            salTxt: '50%',
            salPct: 50,
            salWidth: '50%',
            ultimoSal: '01/09/2026',
            preventivoTxt: '€ 20.000',
            costiTxt: '€ 1.500',
            maturatoTxt: '€ 10.000',
            margineTxt: '€ 8.500',
            margineColor: '#201e1d',
            voci: [
                { descrizione: 'Materiale elettrico', tipo: 'Fattura', data: '10/09/2026', importoTxt: '€ 500,00' },
                { descrizione: 'Manodopera', tipo: 'Ore', data: '12/09/2026', importoTxt: '€ 1.000,00' }
            ]
        });

        const cantieri = ref([
            {
                nome: 'Villa Rossi',
                cliente: 'Mario Rossi',
                indirizzo: 'Via Roma 12, Milano',
                stato: 'In corso',
                margineTxt: '€ 8.500',
                margineColor: '#201e1d',
                salTxt: '50%',
                salWidth: '50%',
                preventivoTxt: '€ 20.000',
                costiTxt: '€ 1.500',
                costWidth: '7%',
                salWidth2: '43%',
                open: () => { view.value = 'cantiere'; sel.value = cantieri.value[0]; }
            },
            {
                nome: 'Appartamento Bianchi',
                cliente: 'Luigi Bianchi',
                indirizzo: 'Via Verdi 4, Milano',
                stato: 'In corso',
                margineTxt: '€ 740',
                margineColor: '#ae1800',
                salTxt: '10%',
                salWidth: '10%',
                preventivoTxt: '€ 10.000',
                costiTxt: '€ 260',
                costWidth: '2%',
                salWidth2: '8%',
                open: () => { view.value = 'cantiere'; sel.value = cantieri.value[1]; }
            }
        ]);
        
        const lavorazioni = ref([
            { id: 1, nome: 'Posa massetto', quota: '25% del totale', checked: true },
            { id: 2, nome: 'Tracce idrauliche', quota: '15% del totale', checked: false }
        ]);
        
        // Dynamic derived props for lavorazioni
        lavorazioni.value.forEach(l => {
            Object.defineProperty(l, 'mark', { get: () => l.checked ? '✓' : '' });
            Object.defineProperty(l, 'boxBorder', { get: () => l.checked ? '#ec3013' : 'rgba(32,30,29,.4)' });
            Object.defineProperty(l, 'boxBg', { get: () => l.checked ? '#ec3013' : 'transparent' });
            l.toggle = () => l.checked = !l.checked;
        });
        
        const operai = ref([
            { nome: 'Mario Rossi', costoTxt: '€25/h', cantiere: 'Villa Rossi', ore: 8 },
            { nome: 'Luigi Bianchi', costoTxt: '€25/h', cantiere: 'Villa Rossi', ore: 8 }
        ]);
        
        operai.value.forEach(o => {
            Object.defineProperty(o, 'costoGiornoTxt', { get: () => '€ ' + (o.ore * 25) + ',00' });
            Object.defineProperty(o, 'oreTxt', { get: () => o.ore + ' h' });
            o.dec = () => { if (o.ore > 0) o.ore--; };
            o.inc = () => { if (o.ore < 12) o.ore++; };
        });

        const materiali = ref([
            { nome: 'Sacco Cemento 25kg', fornitore: 'Edilfer', cantiere: 'Villa Rossi', data: '18/09/2026', quantita: '20 pz', costoTxt: '€ 120,00' },
            { nome: 'Piastrelle Ceramica', fornitore: 'Marazzi', cantiere: 'Appartamento Bianchi', data: '16/09/2026', quantita: '50 mq', costoTxt: '€ 1.250,00' },
            { nome: 'Tubi PVC 100mm', fornitore: 'IdroTubi', cantiere: 'Villa Rossi', data: '15/09/2026', quantita: '15 m', costoTxt: '€ 45,00' }
        ]);

        const vals = computed(() => ({
            isOggi: view.value === 'oggi',
            isCantieri: view.value === 'cantieri',
            isCantiere: view.value === 'cantiere',
            isSal1: view.value === 'sal1',
            isSal2: view.value === 'sal2',
            isSal3: view.value === 'sal3',
            isSalOk: view.value === 'salOk',
            isSquadra: view.value === 'squadra',
            isCosti: view.value === 'costi',
            isMateriali: view.value === 'materiali',
            
            // Navigation
            goSquadra: () => { view.value = 'squadra'; window.scrollTo(0, 0); },
            goCantieri: () => { view.value = 'cantieri'; window.scrollTo(0, 0); },
            goCosti: () => { view.value = 'costi'; window.scrollTo(0, 0); },
            goOggi: () => { view.value = 'oggi'; window.scrollTo(0, 0); },
            goMateriali: () => { view.value = 'materiali'; window.scrollTo(0, 0); },
            
            // SAL flow
            startSal: () => { 
                view.value = 'sal1'; 
                window.scrollTo(0, 0);
                salPct.value = 65; 
                foto.value = []; 
                fattura.value = false;
                nota.value = "";
            },
            closeSal: () => { view.value = 'cantiere'; window.scrollTo(0, 0); },
            toSal1: () => { view.value = 'sal1'; window.scrollTo(0, 0); },
            toSal2: () => { view.value = 'sal2'; window.scrollTo(0, 0); },
            toSal3: () => { view.value = 'sal3'; window.scrollTo(0, 0); },
            confirmSal: () => { 
                sel.value.salPct = salPct.value;
                sel.value.salTxt = salPct.value + '%';
                sel.value.salWidth = salPct.value + '%';
                view.value = 'salOk'; 
                window.scrollTo(0, 0);
            },
            backToCantiere: () => { view.value = 'cantiere'; window.scrollTo(0, 0); },
            
            // Sal1 Data
            sel: sel.value,
            salPct: salPct.value,
            salWidth: salPct.value + '%',
            decSal: () => { if (salPct.value > 0) salPct.value -= 5; },
            incSal: () => { if (salPct.value < 100) salPct.value += 5; },
            salChips: [
                { label: '50%', bg: '#eae9e9', fg: '#201e1d', set: () => salPct.value = 50 },
                { label: '65%', bg: '#eae9e9', fg: '#201e1d', set: () => salPct.value = 65 },
                { label: '80%', bg: '#eae9e9', fg: '#201e1d', set: () => salPct.value = 80 },
                { label: '100%', bg: '#eae9e9', fg: '#201e1d', set: () => salPct.value = 100 },
            ],
            lavorazioni: lavorazioni.value,
            
            // Sal2 Data
            addFoto: () => {
                const now = new Date();
                const h = String(now.getHours()).padStart(2, '0');
                const m = String(now.getMinutes()).padStart(2, '0');
                foto.value.push({ bg: '#d7d3d3', fg: '#605d5d', tag: 'NUOVA', ora: `${h}:${m}` });
            },
            fotoCount: foto.value.length,
            fotoStato: foto.value.length > 0 ? 'Salvate sul cloud' : 'Nessuna foto',
            foto: foto.value,
            
            // Sal3 Data
            nuovoMaturatoTxt: '€ 13.000',
            nuovoMargineTxt: '€ 11.500',
            nuovoMargineColor: '#201e1d',
            lavCount: lavorazioni.value.filter(l => l.checked).length,
            fatturaBorder: fattura.value ? '#ec3013' : 'rgba(32,30,29,.4)',
            fatturaBg: fattura.value ? '#fbeae7' : '#eae9e9',
            fatturaBox: fattura.value ? '#ec3013' : 'transparent',
            fatturaMark: fattura.value ? '✓' : '',
            deltaFatturaTxt: '€ 3.000',
            toggleFattura: () => { fattura.value = !fattura.value; },
            
            // Cantieri List
            cantieri: cantieri.value,
            
            // Squadra
            operai: operai.value,
            costoManodoperaTxt: '€ ' + operai.value.reduce((acc, o) => acc + (o.ore * 25), 0) + ',00',
            
            // Materiali
            materiali: materiali.value,
            
        }));

        return { vals, nota };
    },

<div v-if="vals.isOggi">
<div>
<div style="position:sticky;top:0;z-index:3;background:#f3f2f2;padding:62px 20px 12px;border-bottom:2px solid rgba(32,30,29,.4)">
<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px">
<div>
<div style="font:800 10px Archivo;letter-spacing:.14em;text-transform:uppercase;color:rgba(32,30,29,.55)">Venerdì 18 settembre</div>
<div style="font:800 30px/1.05 Archivo;letter-spacing:-.02em;margin-top:2px">Oggi</div>
</div>
<div style="display:flex;align-items:center;gap:6px;padding:5px 8px;border:1px solid rgba(32,30,29,.4);font:600 10px Archivo;letter-spacing:.06em;text-transform:uppercase;color:rgba(32,30,29,.6)">
<span style="width:7px;height:7px;background:#ec3013;display:block"></span>Sincr. 2 min fa</div>

</div>

<div style="padding:0 20px 24px">
<div style="display:flex;border-bottom:2px solid rgba(32,30,29,.4)">
<div style="flex:1;padding:14px 0"><div style="font:800 26px/1 Archivo;letter-spacing:-.02em">3</div><div style="font:400 11px Archivo;color:rgba(32,30,29,.6);margin-top:4px">Cantieri aperti</div></div>
<div style="flex:1;padding:14px 0 14px 16px;border-left:1px solid rgba(32,30,29,.2)"><div style="font:800 26px/1 Archivo;letter-spacing:-.02em">€ 9.240</div><div style="font:400 11px Archivo;color:rgba(32,30,29,.6);margin-top:4px">Margine maturato</div></div>
<div style="flex:1;padding:14px 0 14px 16px;border-left:1px solid rgba(32,30,29,.2)"><div style="font:800 26px/1 Archivo;letter-spacing:-.02em;color:#ae1800">2</div><div style="font:400 11px Archivo;color:rgba(32,30,29,.6);margin-top:4px">Scadenze ≤30gg</div></div>
</div>

<div style="display:flex;align-items:center;gap:12px;background:#ec3013;color:#f3f2f2;padding:12px 14px;margin-top:16px">
<span style="font:800 24px/1 Archivo">!</span>
<div style="flex:1"><div style="font:800 13px/1.2 Archivo">DURC in scadenza il 5 ottobre</div><div style="font:400 11px/1.3 Archivo;opacity:.85;margin-top:2px">15 giorni · blocca gli incassi da pubblico</div></div>
<div style="font:800 11px Archivo;letter-spacing:.06em;text-transform:uppercase;border-bottom:2px solid #f3f2f2;padding-bottom:1px">Apri</div>

<span style="font:800 18px/1 Archivo;color:#ec3013">▤</span><span style="font:600 13px Archivo">Rapportino</span></div>

<span style="font:800 18px/1 Archivo;color:#ec3013">◫</span><span style="font:600 13px Archivo">Scansiona DDT</span></div>
<div @click="vals.goMateriali" class="active-btn" style="background:#f3f2f2;padding:16px 14px;min-height:74px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer">
<span style="font:800 18px/1 Archivo;color:#ec3013">◈</span><span style="font:600 13px Archivo">Materiali</span></div>
</div>

<div style="display:flex;align-items:baseline;justify-content:space-between;margin:28px 0 10px">
<div style="font:800 10px Archivo;letter-spacing:.14em;text-transform:uppercase;color:rgba(32,30,29,.55)">Cantieri</div>
<div @click="vals.goCantieri" style="font:600 11px Archivo;color:#ae1800;cursor:pointer">Tutti →</div>
</div>
<div v-for="(c, i) in vals.cantieri" :key="i">
<div @click="c.open" style="border-top:2px solid rgba(32,30,29,.4);padding:14px 0;cursor:pointer">
<div style="display:flex;justify-content:space-between;gap:12px;align-items:baseline">
<div style="font:800 15px/1.2 Archivo;letter-spacing:-.01em">{{ c.nome }}</div>
<div style="font:800 15px Archivo;white-space:nowrap" :style="{ color: c.margineColor }">{{ c.margineTxt }}</div>
</div>

<div style="display:flex;align-items:center;gap:10px;margin-top:10px">

<div style="font:800 11px Archivo;width:56px;text-align:right">SAL {{ c.salTxt }}</div>
</div>
</div>
</div>
</div>
</div>
</div>

<div v-if="vals.isCantieri">
<div>
<div style="position:sticky;top:0;z-index:3;background:#f3f2f2;padding:62px 20px 12px;border-bottom:2px solid rgba(32,30,29,.4)">
<div style="font:800 30px/1.05 Archivo;letter-spacing:-.02em">Cantieri</div>

<div style="padding:7px 11px;background:#201e1d;color:#f3f2f2;font:600 11px Archivo">In corso · 3</div>

</div>

<div style="padding:0 20px 24px">
<div v-for="(c, i) in vals.cantieri" :key="i">

<div style="font:800 10px Archivo;letter-spacing:.12em;text-transform:uppercase;color:#ae1800">{{ c.stato }}</div>

<div style="flex:1;background:#f3f2f2;padding:8px 0 8px 10px"><div style="font:400 10px Archivo;color:rgba(32,30,29,.6)">Margine</div><div style="font:800 14px Archivo;margin-top:2px" :style="{ color: c.margineColor }">{{ c.margineTxt }}</div></div>

<div style="display:flex;align-items:center;gap:10px;margin-top:12px">
<div style="flex:1;height:8px;background:rgba(32,30,29,.14)"><div style="height:8px;background:#ec3013" :style="{ width: c.salWidth }"></div></div>
<div style="font:800 11px Archivo;width:56px;text-align:right">SAL {{ c.salTxt }}</div>
</div>
</div>
</div>
</div>
</div>
</div>

</div>
<div style="padding:0 20px 24px">
<div style="padding:18px 0 16px;border-bottom:2px solid rgba(32,30,29,.4)">
